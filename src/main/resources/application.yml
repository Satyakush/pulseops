spring:
  datasource:
    url: jdbc:h2:mem:pulseops;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false

pulseops:
  security:
    users:
      - username: viewer
        password: "{noop}viewer"
        role: VIEWER
      - username: operator
        password: "{noop}operator"
        role: OPERATOR
      - username: admin
        password: "{noop}admin"
        role: ADMIN
