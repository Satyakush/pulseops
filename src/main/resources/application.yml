spring:
  datasource:
    url: jdbc:h2:mem:pulseops;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false

pulseops:
  security:
    users:
      - username: viewer
        password: ${PULSEOPS_VIEWER_PASSWORD}
        role: VIEWER
      - username: operator
        password: ${PULSEOPS_OPERATOR_PASSWORD}
        role: OPERATOR
      - username: admin
        password: ${PULSEOPS_ADMIN_PASSWORD}
        role: ADMIN
  cache:
    redis:
      enabled: false
    ttl: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true
