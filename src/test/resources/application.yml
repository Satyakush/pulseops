pulseops:
  security:
    users:
      - username: viewer
        password: '{noop}viewer'
        role: VIEWER
      - username: operator
        password: '{noop}operator'
        role: OPERATOR
      - username: admin
        password: '{noop}admin'
        role: ADMIN
  cache:
    redis:
      enabled: false

spring:
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:pulseops-test;DB_CLOSE_DELAY=-1
